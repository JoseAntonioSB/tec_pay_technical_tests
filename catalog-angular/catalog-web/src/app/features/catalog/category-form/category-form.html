<div class="container">
    <div class="page-header">
        <h1>{{ isEditMode ? 'Edit Category' : 'Create Category' }}</h1>
        <div class="page-header-actions">
            <a routerLink="/catalog/products" class="btn btn-ghost">Back to List</a>
        </div>
    </div>

    @if (error()) {
    <div class="alert alert-error">{{ error() }}</div>
    }

    @if (loading()) {
    <div class="loading">Loading...</div>
    } @else {
    <div class="form-card">
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label class="form-label">Name *</label>
                <input type="text" class="form-input" formControlName="name" />
                @if (hasError('name', 'required')) {
                <span class="form-error">Name is required.</span>
                }
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea class="form-input" rows="3" formControlName="description"></textarea>
            </div>

            <!-- <div class="form-actions">
                <button type="submit" class="btn btn-primary" [disabled]="form.invalid || store.saving()">
                    @if (store.saving()) {
                    <span>Saving...</span>
                    } @else {
                    <span>{{ isEditMode ? 'Update Category' : 'Create Category' }}</span>
                    }
                </button>
                <button type="button" class="btn btn-secondary" [disabled]="store.saving()" (click)="onCancel()">
                    Cancel
                </button>
            </div> -->
            <div class="form-actions">
                <a routerLink="/catalog/products" class="btn btn-ghost">Cancel</a>
                <button type="submit" class="btn btn-primary" [disabled]="submitting()">
                    {{ submitting() ? 'Saving...' : (isEditMode ? 'Update' : 'Create') }}
                </button>
            </div>
        </form>
    </div>
    }
</div>
